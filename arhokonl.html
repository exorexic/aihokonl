<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🏒 Настольный хоккей - Онлайн, Бот, 2 игрока</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a472a 0%, #0a2a1a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Arial', 'Roboto', sans-serif;
            padding: 10px;
            overflow-x: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        .game-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            max-width: 1200px;
        }

        .game-container {
            background: rgba(0,0,0,0.4);
            border-radius: 20px;
            padding: 12px;
            backdrop-filter: blur(5px);
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .canvas-wrapper {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            cursor: none;
            width: 100%;
            height: auto;
            max-width: 100%;
            object-fit: contain;
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .score-card {
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            padding: 8px 15px;
            border-radius: 20px;
            text-align: center;
            flex: 1;
            min-width: 90px;
        }

        .score-label {
            font-size: 11px;
            color: #aaa;
            letter-spacing: 1px;
        }

        .score-value {
            font-size: 32px;
            font-weight: bold;
            line-height: 1;
            margin-top: 3px;
        }

        .score-left .score-value { color: #ff6b6b; }
        .score-right .score-value { color: #4ecdc4; }

        .vs-badge {
            background: rgba(0,0,0,0.8);
            padding: 8px 15px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            color: gold;
        }

        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: all 0.3s ease;
            overflow-y: auto;
        }

        .menu-container {
            background: linear-gradient(135deg, #2c3e50, #1a2632);
            border-radius: 40px;
            padding: 25px 20px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
            animation: slideIn 0.4s ease;
            margin: 20px;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .menu-container h1 {
            font-size: 36px;
            margin: 0 0 5px 0;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .mode-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .mode-btn {
            flex: 1;
            min-width: 110px;
            padding: 12px 15px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(255,255,255,0.1);
            color: white;
        }

        .mode-btn.two-players {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .mode-btn.bot {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
        }

        .mode-btn.online {
            background: linear-gradient(135deg, #f093fb, #f5576c);
        }

        .mode-btn:hover {
            transform: translateY(-3px);
            filter: brightness(1.1);
        }

        .online-panel {
            background: rgba(0,0,0,0.5);
            border-radius: 25px;
            padding: 15px;
            margin-top: 15px;
            display: none;
        }

        .online-panel.active {
            display: block;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .room-control {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 12px 0;
            flex-wrap: wrap;
        }

        input {
            padding: 10px 12px;
            font-size: 14px;
            border: none;
            border-radius: 50px;
            background: rgba(255,255,255,0.95);
            outline: none;
            text-align: center;
            font-family: monospace;
            font-weight: bold;
        }

        button {
            padding: 10px 16px;
            font-size: 13px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s;
            background: #4caf50;
            color: white;
        }

        button.secondary {
            background: #ff9800;
        }

        button.danger {
            background: #f44336;
        }

        button:active {
            transform: scale(0.96);
        }

        .status {
            margin-top: 12px;
            padding: 8px;
            border-radius: 20px;
            background: rgba(0,0,0,0.5);
            font-size: 12px;
            word-break: break-word;
        }

        .status.connected {
            background: rgba(76,175,80,0.3);
            color: #4caf50;
            border-left: 3px solid #4caf50;
        }

        .status.waiting {
            background: rgba(255,152,0,0.3);
            color: #ff9800;
            border-left: 3px solid #ff9800;
        }

        .controls-info {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 12px;
            color: white;
            font-size: 10px;
            background: rgba(0,0,0,0.6);
            padding: 6px 12px;
            border-radius: 50px;
            flex-wrap: wrap;
        }

        .back-menu-btn {
            margin-top: 10px;
            background: rgba(0,0,0,0.6);
            font-size: 12px;
            padding: 6px 16px;
        }

        @media (max-width: 700px) {
            .score-value { font-size: 24px; }
            .score-card { padding: 5px 10px; min-width: 70px; }
            .vs-badge { font-size: 14px; padding: 5px 12px; }
            .mode-btn { padding: 10px 12px; font-size: 13px; min-width: 90px; }
            .menu-container h1 { font-size: 28px; }
        }

        @media (orientation: landscape) {
            body {
                padding: 5px;
            }
            .game-container {
                padding: 8px;
            }
            .score-board {
                margin-bottom: 8px;
            }
            .score-value {
                font-size: 28px;
            }
            .controls-info {
                margin-top: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="game-container">
            <div class="score-board">
                <div class="score-card score-left">
                    <div class="score-label" id="leftLabel">🔴 ИГРОК</div>
                    <div class="score-value" id="scoreLeft">0</div>
                </div>
                <div class="vs-badge">🏒 VS 🏒</div>
                <div class="score-card score-right">
                    <div class="score-label" id="rightLabel">🔵 СОПЕРНИК</div>
                    <div class="score-value" id="scoreRight">0</div>
                </div>
            </div>
            
            <div class="canvas-wrapper">
                <canvas id="gameCanvas" width="1000" height="600"></canvas>
            </div>
            
            <button class="back-menu-btn" id="backToMenuBtn">🏠 Главное меню</button>
            
            <div class="controls-info" id="controlsInfo">
                <span>🎮 Выберите режим в меню</span>
            </div>
        </div>
    </div>

    <div class="menu-overlay" id="menuOverlay">
        <div class="menu-container">
            <h1>🏒 AIR HOCKEY</h1>
            <div class="mode-buttons">
                <button class="mode-btn two-players" id="twoPlayersBtn">👥 2 игрока<br><span style="font-size: 10px;">на одном телефоне</span></button>
                <button class="mode-btn bot" id="botModeBtn">🤖 Игра с ботом<br><span style="font-size: 10px;">один игрок</span></button>
                <button class="mode-btn online" id="onlineModeBtn">🌐 Онлайн<br><span style="font-size: 10px;">по коду комнаты</span></button>
            </div>
            
            <div id="onlinePanel" class="online-panel">
                <h3 style="margin:0 0 8px 0; font-size: 18px;">🎮 Онлайн режим</h3>
                <div class="room-control">
                    <input type="text" id="roomCodeInput" placeholder="Код комнаты" maxlength="10" autocomplete="off">
                    <button id="createRoomBtn">✨ Создать</button>
                    <button id="joinRoomBtn" class="secondary">🔗 Войти</button>
                </div>
                <div id="onlineStatus" class="status waiting">💡 Создайте комнату и дайте код другу!</div>
                <div style="font-size: 10px; margin-top: 8px; color: #aaa;">
                    📡 Играйте с другом на расстоянии
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Размеры поля (фиксированные для canvas)
        const W = 1000;
        const H = 600;
        
        // Параметры бит (увеличенные)
        const PADDLE_RADIUS = 45;
        const PUCK_RADIUS = 14;
        
        // Параметры ворот
        const GOAL_WIDTH = 110;
        const GOAL_HEIGHT = 22;
        
        let gameMode = null; // 'twoPlayers', 'bot', 'online'
        let gameActive = true;
        
        // Рандомные аватарки
        const avatars = [
            { emoji: '🐱', name: 'Кот' },
            { emoji: '🐶', name: 'Собака' },
            { emoji: '🐭', name: 'Мышь' },
            { emoji: '🐹', name: 'Хомяк' },
            { emoji: '🐰', name: 'Кролик' },
            { emoji: '🦊', name: 'Лиса' },
            { emoji: '🐻', name: 'Медведь' },
            { emoji: '🐼', name: 'Панда' },
            { emoji: '🐨', name: 'Коала' },
            { emoji: '🐸', name: 'Лягушка' },
            { emoji: '🐒', name: 'Обезьяна' },
            { emoji: '🦁', name: 'Лев' },
            { emoji: '🐮', name: 'Корова' },
            { emoji: '🐷', name: 'Свинья' },
            { emoji: '🐧', name: 'Пингвин' },
            { emoji: '🦉', name: 'Сова' },
            { emoji: '🐺', name: 'Волк' },
            { emoji: '🦄', name: 'Единорог' },
            { emoji: '🐉', name: 'Дракон' },
            { emoji: '🦋', name: 'Бабочка' }
        ];
        
        // Рандомные аватарки для игроков
        let player1Avatar = avatars[Math.floor(Math.random() * avatars.length)];
        let player2Avatar = avatars[Math.floor(Math.random() * avatars.length)];
        
        // Игровые объекты
        let player1 = { x: 120, y: H/2, radius: PADDLE_RADIUS, avatar: player1Avatar };
        let player2 = { x: W - 120, y: H/2, radius: PADDLE_RADIUS, avatar: player2Avatar };
        let puck = { 
            x: W/2, 
            y: H/2, 
            vx: 0, 
            vy: 0,
            radius: PUCK_RADIUS
        };
        
        let scores = { left: 0, right: 0 };
        
        // Управление
        let touchPoints = { x1: player1.x, y1: player1.y, x2: player2.x, y2: player2.y };
        
        // Онлайн переменные
        let ws = null;
        let roomId = null;
        let isHost = false;
        
        // DOM элементы
        const scoreLeftSpan = document.getElementById('scoreLeft');
        const scoreRightSpan = document.getElementById('scoreRight');
        const leftLabel = document.getElementById('leftLabel');
        const rightLabel = document.getElementById('rightLabel');
        const menuOverlay = document.getElementById('menuOverlay');
        const backToMenuBtn = document.getElementById('backToMenuBtn');
        const twoPlayersBtn = document.getElementById('twoPlayersBtn');
        const botModeBtn = document.getElementById('botModeBtn');
        const onlineModeBtn = document.getElementById('onlineModeBtn');
        const onlinePanel = document.getElementById('onlinePanel');
        const roomCodeInput = document.getElementById('roomCodeInput');
        const createRoomBtn = document.getElementById('createRoomBtn');
        const joinRoomBtn = document.getElementById('joinRoomBtn');
        const onlineStatus = document.getElementById('onlineStatus');
        const controlsInfo = document.getElementById('controlsInfo');
        
        function updateScoreDisplay() {
            scoreLeftSpan.textContent = scores.left;
            scoreRightSpan.textContent = scores.right;
        }
        
        function resetPuck() {
            puck.x = W/2;
            puck.y = H/2;
            let angle = (Math.random() * Math.PI * 2);
            let speed = 5.5;
            puck.vx = Math.cos(angle) * speed;
            puck.vy = Math.sin(angle) * speed;
            
            if (Math.abs(puck.vx) < 2.5) puck.vx = puck.vx > 0 ? 3.5 : -3.5;
            if (Math.abs(puck.vy) < 2) puck.vy = puck.vy > 0 ? 2.5 : -2.5;
        }
        
        function resetGame() {
            scores = { left: 0, right: 0 };
            updateScoreDisplay();
            player1.x = 120;
            player1.y = H/2;
            player2.x = W - 120;
            player2.y = H/2;
            resetPuck();
            gameActive = true;
        }
        
        function circlesCollide(x1, y1, r1, x2, y2, r2) {
            const dx = x1 - x2;
            const dy = y1 - y2;
            const dist = Math.sqrt(dx * dx + dy * dy);
            return dist < r1 + r2;
        }
        
        function handleCollision(paddle, puck, isPlayer2 = false) {
            if (circlesCollide(paddle.x, paddle.y, paddle.radius, puck.x, puck.y, puck.radius)) {
                const dx = puck.x - paddle.x;
                const dy = puck.y - paddle.y;
                const angle = Math.atan2(dy, dx);
                
                const speed = Math.hypot(puck.vx, puck.vy);
                const newSpeed = Math.min(14, speed + 1.8);
                
                puck.vx = Math.cos(angle) * newSpeed;
                puck.vy = Math.sin(angle) * newSpeed;
                
                if (paddle.vx) {
                    puck.vx += paddle.vx * 0.6;
                    puck.vy += paddle.vy * 0.6;
                }
                
                puck.x = paddle.x + Math.cos(angle) * (paddle.radius + puck.radius + 2);
                puck.y = paddle.y + Math.sin(angle) * (paddle.radius + puck.radius + 2);
                
                return true;
            }
            return false;
        }
        
        function checkGoal() {
            const leftGoalY = H/2 - GOAL_WIDTH/2;
            const rightGoalY = H/2 - GOAL_WIDTH/2;
            
            if (puck.x - puck.radius <= GOAL_HEIGHT &&
                puck.y + puck.radius > leftGoalY &&
                puck.y - puck.radius < leftGoalY + GOAL_WIDTH) {
                scores.right++;
                updateScoreDisplay();
                resetPuck();
                if (gameMode === 'online') sendGameState();
                return true;
            }
            
            if (puck.x + puck.radius >= W - GOAL_HEIGHT &&
                puck.y + puck.radius > rightGoalY &&
                puck.y - puck.radius < rightGoalY + GOAL_WIDTH) {
                scores.left++;
                updateScoreDisplay();
                resetPuck();
                if (gameMode === 'online') sendGameState();
                return true;
            }
            return false;
        }
        
        function updatePhysics() {
            if (!gameActive) return;
            
            puck.x += puck.vx;
            puck.y += puck.vy;
            
            // Столкновение со стенами
            if (puck.y - puck.radius <= 0) {
                puck.y = puck.radius;
                puck.vy = -puck.vy * 0.98;
            }
            if (puck.y + puck.radius >= H) {
                puck.y = H - puck.radius;
                puck.vy = -puck.vy * 0.98;
            }
            
            const leftGoalY = H/2 - GOAL_WIDTH/2;
            const rightGoalY = H/2 - GOAL_WIDTH/2;
            
            // Левая стена
            if (puck.x - puck.radius <= 0) {
                if (!(puck.y + puck.radius > leftGoalY && puck.y - puck.radius < leftGoalY + GOAL_WIDTH)) {
                    puck.x = puck.radius;
                    puck.vx = -puck.vx * 0.9;
                }
            }
            // Правая стена
            if (puck.x + puck.radius >= W) {
                if (!(puck.y + puck.radius > rightGoalY && puck.y - puck.radius < rightGoalY + GOAL_WIDTH)) {
                    puck.x = W - puck.radius;
                    puck.vx = -puck.vx * 0.9;
                }
            }
            
            handleCollision(player1, puck, false);
            handleCollision(player2, puck, true);
            checkGoal();
            
            // Ограничение скорости
            const maxSpeed = 14;
            if (Math.abs(puck.vx) > maxSpeed) puck.vx = puck.vx > 0 ? maxSpeed : -maxSpeed;
            if (Math.abs(puck.vy) > maxSpeed) puck.vy = puck.vy > 0 ? maxSpeed : -maxSpeed;
            
            puck.vx *= 0.998;
            puck.vy *= 0.998;
        }
        
        // БОТ
        function updateBot() {
            if (gameMode !== 'bot') return;
            
            let targetY = puck.y;
            
            if (puck.vx > 0 && puck.x > W/2) {
                let predictedY = puck.y + puck.vy * 12;
                targetY = Math.max(PADDLE_RADIUS, Math.min(H - PADDLE_RADIUS, predictedY));
            }
            
            const botSpeed = 0.12;
            player2.y += (targetY - player2.y) * botSpeed;
            player2.y = Math.max(PADDLE_RADIUS, Math.min(H - PADDLE_RADIUS, player2.y));
            player2.x = W - 120;
        }
        
        function updatePlayers() {
            if (gameMode === 'twoPlayers') {
                player1.x += (touchPoints.x1 - player1.x) * 0.35;
                player1.y += (touchPoints.y1 - player1.y) * 0.35;
                player2.x += (touchPoints.x2 - player2.x) * 0.35;
                player2.y += (touchPoints.y2 - player2.y) * 0.35;
            } else if (gameMode === 'bot') {
                player1.x += (touchPoints.x1 - player1.x) * 0.35;
                player1.y += (touchPoints.y1 - player1.y) * 0.35;
                updateBot();
            } else if (gameMode === 'online') {
                if (isHost) {
                    player1.x += (touchPoints.x1 - player1.x) * 0.35;
                    player1.y += (touchPoints.y1 - player1.y) * 0.35;
                } else {
                    player2.x += (touchPoints.x2 - player2.x) * 0.35;
                    player2.y += (touchPoints.y2 - player2.y) * 0.35;
                }
            }
            
            // Ограничения для бит
            player1.x = Math.max(60 + PADDLE_RADIUS, Math.min(W/2 - 50, player1.x));
            player1.y = Math.max(PADDLE_RADIUS, Math.min(H - PADDLE_RADIUS, player1.y));
            player2.x = Math.max(W/2 + 50, Math.min(W - 60 - PADDLE_RADIUS, player2.x));
            player2.y = Math.max(PADDLE_RADIUS, Math.min(H - PADDLE_RADIUS, player2.y));
            
            // Запоминаем скорость
            player1.vx = player1.x - (player1.prevX || player1.x);
            player1.vy = player1.y - (player1.prevY || player1.y);
            player2.vx = player2.x - (player2.prevX || player2.x);
            player2.vy = player2.y - (player2.prevY || player2.y);
            
            player1.prevX = player1.x;
            player1.prevY = player1.y;
            player2.prevX = player2.x;
            player2.prevY = player2.y;
        }
        
        function draw() {
            ctx.clearRect(0, 0, W, H);
            
            // Лед
            const gradient = ctx.createLinearGradient(0, 0, 0, H);
            gradient.addColorStop(0, '#7cb8e0');
            gradient.addColorStop(1, '#5a9ac0');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, W, H);
            
            // Разметка
            ctx.beginPath();
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 4;
            ctx.setLineDash([15, 25]);
            ctx.moveTo(W/2, 0);
            ctx.lineTo(W/2, H);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.beginPath();
            ctx.arc(W/2, H/2, 90, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(W/2, H/2, 45, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.fill();
            
            // Ворота
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(0, H/2 - GOAL_WIDTH/2, GOAL_HEIGHT, GOAL_WIDTH);
            ctx.fillRect(W - GOAL_HEIGHT, H/2 - GOAL_WIDTH/2, GOAL_HEIGHT, GOAL_WIDTH);
            
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(2, H/2 - GOAL_WIDTH/2 + 5, GOAL_HEIGHT - 4, GOAL_WIDTH - 10);
            ctx.fillStyle = '#2ecc71';
            ctx.fillRect(W - GOAL_HEIGHT + 2, H/2 - GOAL_WIDTH/2 + 5, GOAL_HEIGHT - 4, GOAL_WIDTH - 10);
            
            // Биты с аватарками
            ctx.shadowBlur = 12;
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            
            // Левая бита
            const grad1 = ctx.createRadialGradient(player1.x-12, player1.y-12, 8, player1.x, player1.y, PADDLE_RADIUS);
            grad1.addColorStop(0, '#ff6b6b');
            grad1.addColorStop(1, '#c0392b');
            ctx.fillStyle = grad1;
            ctx.beginPath();
            ctx.arc(player1.x, player1.y, PADDLE_RADIUS, 0, Math.PI * 2);
            ctx.fill();
            
            // Аватарка на левой бите (только эмодзи)
            ctx.font = `${PADDLE_RADIUS * 0.65}px "Segoe UI Emoji"`;
            ctx.fillStyle = 'white';
            ctx.shadowBlur = 3;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(player1.avatar.emoji, player1.x, player1.y);
            
            // Правая бита
            const grad2 = ctx.createRadialGradient(player2.x-12, player2.y-12, 8, player2.x, player2.y, PADDLE_RADIUS);
            grad2.addColorStop(0, '#4ecdc4');
            grad2.addColorStop(1, '#2c7a6e');
            ctx.fillStyle = grad2;
            ctx.beginPath();
            ctx.arc(player2.x, player2.y, PADDLE_RADIUS, 0, Math.PI * 2);
            ctx.fill();
            
            // Аватарка на правой бите (только эмодзи)
            ctx.fillStyle = 'white';
            ctx.fillText(player2.avatar.emoji, player2.x, player2.y);
            
            // Шайба
            ctx.fillStyle = '#2c3e50';
            ctx.beginPath();
            ctx.arc(puck.x, puck.y, PUCK_RADIUS, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ecf0f1';
            ctx.beginPath();
            ctx.arc(puck.x-3, puck.y-3, 4, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.shadowBlur = 0;
            ctx.textAlign = 'left';
            
            // Текст режима (без надписей над аватарками)
            ctx.font = 'bold 14px "Segoe UI"';
            ctx.fillStyle = 'white';
            if (gameMode === 'twoPlayers') {
                ctx.fillText(`👥 2 игрока на одном телефоне`, 20, 35);
            } else if (gameMode === 'bot') {
                ctx.fillText(`🤖 Игрок VS Бот`, 20, 35);
            } else if (gameMode === 'online') {
                ctx.fillText(`🌐 Онлайн игра`, 20, 35);
            }
        }
        
        // Обработка касаний
        function handleTouchStart(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const scaleX = W / rect.width;
            const scaleY = H / rect.height;
            
            for(let i = 0; i < e.touches.length; i++) {
                const touch = e.touches[i];
                let canvasX = (touch.clientX - rect.left) * scaleX;
                let canvasY = (touch.clientY - rect.top) * scaleY;
                canvasX = Math.max(0, Math.min(W, canvasX));
                canvasY = Math.max(0, Math.min(H, canvasY));
                
                if (gameMode === 'twoPlayers') {
                    if (canvasX < W/2) {
                        touchPoints.x1 = canvasX;
                        touchPoints.y1 = canvasY;
                    } else {
                        touchPoints.x2 = canvasX;
                        touchPoints.y2 = canvasY;
                    }
                } else if (gameMode === 'bot') {
                    touchPoints.x1 = canvasX;
                    touchPoints.y1 = canvasY;
                } else if (gameMode === 'online') {
                    if (isHost) {
                        touchPoints.x1 = canvasX;
                        touchPoints.y1 = canvasY;
                        sendPaddlePosition();
                    } else {
                        touchPoints.x2 = canvasX;
                        touchPoints.y2 = canvasY;
                        sendPaddlePosition();
                    }
                }
            }
        }
        
        function handleTouchMove(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const scaleX = W / rect.width;
            const scaleY = H / rect.height;
            
            for(let i = 0; i < e.touches.length; i++) {
                const touch = e.touches[i];
                let canvasX = (touch.clientX - rect.left) * scaleX;
                let canvasY = (touch.clientY - rect.top) * scaleY;
                canvasX = Math.max(0, Math.min(W, canvasX));
                canvasY = Math.max(0, Math.min(H, canvasY));
                
                if (gameMode === 'twoPlayers') {
                    if (canvasX < W/2) {
                        touchPoints.x1 = canvasX;
                        touchPoints.y1 = canvasY;
                    } else {
                        touchPoints.x2 = canvasX;
                        touchPoints.y2 = canvasY;
                    }
                } else if (gameMode === 'bot') {
                    touchPoints.x1 = canvasX;
                    touchPoints.y1 = canvasY;
                } else if (gameMode === 'online') {
                    if (isHost) {
                        touchPoints.x1 = canvasX;
                        touchPoints.y1 = canvasY;
                        sendPaddlePosition();
                    } else {
                        touchPoints.x2 = canvasX;
                        touchPoints.y2 = canvasY;
                        sendPaddlePosition();
                    }
                }
            }
        }
        
        // Онлайн функции
        function sendPaddlePosition() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'paddle',
                    y: isHost ? player1.y : player2.y,
                    side: isHost ? 'left' : 'right'
                }));
            }
        }
        
        function sendGameState() {
            if (ws && ws.readyState === WebSocket.OPEN && !isHost) {
                ws.send(JSON.stringify({
                    type: 'state',
                    puck: puck,
                    scores: scores
                }));
            }
        }
        
        function connectWebSocket(room, host) {
            const WS_URL = 'wss://socketsbay.com/wss/v2/1/demo/';
            ws = new WebSocket(WS_URL);
            
            ws.onopen = () => {
                ws.send(JSON.stringify({
                    type: 'join',
                    room: room,
                    host: host,
                    playerId: Math.random().toString(36).substr(2, 6)
                }));
            };
            
            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'joined') {
                        onlineStatus.className = 'status connected';
                        onlineStatus.innerHTML = `✅ Подключено! Ожидание соперника...`;
                        isHost = data.isHost;
                        if (data.playerCount === 2) {
                            onlineStatus.innerHTML = `🎮 Игра началась!`;
                            gameActive = true;
                            resetPuck();
                        }
                    } else if (data.type === 'paddle') {
                        if (data.side === 'left' && !isHost) player1.y = data.y;
                        if (data.side === 'right' && isHost) player2.y = data.y;
                    } else if (data.type === 'state') {
                        if (isHost) {
                            puck = data.puck;
                            scores = data.scores;
                            updateScoreDisplay();
                        }
                    }
                } catch(e) {}
            };
            
            ws.onclose = () => {
                onlineStatus.innerHTML = '❌ Соединение потеряно';
                gameActive = false;
            };
        }
        
        // Режимы игры
        function startTwoPlayers() {
            gameMode = 'twoPlayers';
            leftLabel.innerHTML = `🔴 ИГРОК 1`;
            rightLabel.innerHTML = `🔵 ИГРОК 2`;
            resetGame();
            menuOverlay.style.display = 'none';
            controlsInfo.innerHTML = `👥 Левая половина - красный игрок | Правая половина - синий игрок`;
        }
        
        function startBotMode() {
            gameMode = 'bot';
            leftLabel.innerHTML = `🔴 ИГРОК`;
            rightLabel.innerHTML = `🤖 БОТ`;
            resetGame();
            menuOverlay.style.display = 'none';
            controlsInfo.innerHTML = `🤖 Игра против компьютера - водите пальцем по экрану`;
        }
        
        function startOnlineMode() {
            gameMode = 'online';
            menuOverlay.style.display = 'flex';
            onlinePanel.classList.add('active');
            twoPlayersBtn.style.display = 'none';
            botModeBtn.style.display = 'none';
            onlineModeBtn.style.display = 'none';
        }
        
        function backToMenu() {
            if (ws) ws.close();
            gameMode = null;
            menuOverlay.style.display = 'flex';
            onlinePanel.classList.remove('active');
            twoPlayersBtn.style.display = 'flex';
            botModeBtn.style.display = 'flex';
            onlineModeBtn.style.display = 'flex';
            resetGame();
            controlsInfo.innerHTML = '🎮 Выберите режим в меню';
        }
        
        function createRoom() {
            let code = roomCodeInput.value.trim() || Math.random().toString(36).substring(2, 8).toUpperCase();
            roomCodeInput.value = code;
            isHost = true;
            leftLabel.innerHTML = `🔴 ВЫ (ХОЗЯИН)`;
            rightLabel.innerHTML = `🔵 СОПЕРНИК`;
            connectWebSocket(code, true);
            menuOverlay.style.display = 'none';
            controlsInfo.innerHTML = '🌐 Ожидание подключения соперника...';
        }
        
        function joinRoom() {
            let code = roomCodeInput.value.trim();
            if (!code) {
                onlineStatus.innerHTML = '⚠️ Введите код комнаты!';
                return;
            }
            isHost = false;
            leftLabel.innerHTML = `🔴 СОПЕРНИК`;
            rightLabel.innerHTML = `🔵 ВЫ (ГОСТЬ)`;
            connectWebSocket(code, false);
            menuOverlay.style.display = 'none';
            controlsInfo.innerHTML = '🌐 Подключение...';
        }
        
        // Адаптация canvas под размер экрана
        function resizeCanvas() {
            const container = canvas.parentElement;
            const maxWidth = Math.min(W, container.clientWidth);
            canvas.style.width = `${maxWidth}px`;
            canvas.style.height = 'auto';
        }
        
        // Игровой цикл
        function gameLoop() {
            if (gameMode) {
                updatePlayers();
                updatePhysics();
                draw();
            }
            requestAnimationFrame(gameLoop);
        }
        
        // Инициализация
        function init() {
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            gameLoop();
            
            canvas.addEventListener('touchstart', handleTouchStart);
            canvas.addEventListener('touchmove', handleTouchMove);
            canvas.addEventListener('touchend', (e) => e.preventDefault());
            
            twoPlayersBtn.onclick = startTwoPlayers;
            botModeBtn.onclick = startBotMode;
            onlineModeBtn.onclick = startOnlineMode;
            backToMenuBtn.onclick = backToMenu;
            createRoomBtn.onclick = createRoom;
            joinRoomBtn.onclick = joinRoom;
        }
        
        init();
    </script>
</body>
</html>
