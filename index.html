<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🏒 Настольный хоккей</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a472a 0%, #0a2a1a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            padding: 10px;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        .game-container {
            background: rgba(0,0,0,0.4);
            border-radius: 20px;
            padding: 12px;
            backdrop-filter: blur(5px);
            width: 100%;
            max-width: 1000px;
        }

        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            width: 100%;
            height: auto;
            cursor: none;
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
        }

        .score-card {
            background: rgba(0,0,0,0.8);
            padding: 10px 20px;
            border-radius: 20px;
            text-align: center;
            flex: 1;
        }

        .score-label {
            font-size: 12px;
            color: #aaa;
        }

        .score-value {
            font-size: 40px;
            font-weight: bold;
            margin-top: 5px;
        }

        .score-left .score-value { color: #ff6b6b; }
        .score-right .score-value { color: #4ecdc4; }

        .vs-badge {
            background: rgba(0,0,0,0.8);
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 20px;
            font-weight: bold;
            color: gold;
        }

        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .menu-container {
            background: linear-gradient(135deg, #2c3e50, #1a2632);
            border-radius: 40px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .menu-container h1 {
            font-size: 40px;
            margin: 0 0 10px 0;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .mode-btn {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s;
            color: white;
        }

        .mode-btn.two-players {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .mode-btn.bot {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
        }

        .mode-btn:active {
            transform: scale(0.97);
        }

        .controls-info {
            text-align: center;
            margin-top: 15px;
            color: white;
            font-size: 12px;
            background: rgba(0,0,0,0.6);
            padding: 8px;
            border-radius: 50px;
        }

        .back-btn {
            margin-top: 10px;
            padding: 8px 20px;
            background: rgba(0,0,0,0.6);
            border: none;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
        }

        @media (max-width: 700px) {
            .score-value { font-size: 28px; }
            .score-card { padding: 5px 15px; }
            .vs-badge { font-size: 16px; padding: 5px 15px; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="score-board">
            <div class="score-card score-left">
                <div class="score-label" id="leftLabel">🔴 ИГРОК</div>
                <div class="score-value" id="scoreLeft">0</div>
            </div>
            <div class="vs-badge">🏒 VS 🏒</div>
            <div class="score-card score-right">
                <div class="score-label" id="rightLabel">🔵 СОПЕРНИК</div>
                <div class="score-value" id="scoreRight">0</div>
            </div>
        </div>
        
        <canvas id="gameCanvas" width="1000" height="600"></canvas>
        
        <button class="back-btn" id="backToMenuBtn">🏠 Главное меню</button>
        
        <div class="controls-info" id="controlsInfo">
            🎮 Выберите режим в меню
        </div>
    </div>

    <div class="menu-overlay" id="menuOverlay">
        <div class="menu-container">
            <h1>🏒 AIR HOCKEY</h1>
            <button class="mode-btn two-players" id="twoPlayersBtn">👥 2 игрока (на одном телефоне)</button>
            <button class="mode-btn bot" id="botModeBtn">🤖 Игра с ботом</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const W = 1000;
        const H = 600;
        const PADDLE_RADIUS = 45;
        const PUCK_RADIUS = 14;
        const GOAL_WIDTH = 110;
        const GOAL_HEIGHT = 22;
        
        let gameMode = null;
        let gameActive = true;
        
        // Аватарки
        const avatars = ['🐱', '🐶', '🐼', '🦊', '🐻', '🐨', '🦁', '🐸', '🐒', '🐧', '🦉', '🐺'];
        const player1Avatar = avatars[Math.floor(Math.random() * avatars.length)];
        const player2Avatar = avatars[Math.floor(Math.random() * avatars.length)];
        
        let player1 = { x: 120, y: H/2, radius: PADDLE_RADIUS, avatar: player1Avatar };
        let player2 = { x: W - 120, y: H/2, radius: PADDLE_RADIUS, avatar: player2Avatar };
        let puck = { x: W/2, y: H/2, vx: 0, vy: 0, radius: PUCK_RADIUS };
        let scores = { left: 0, right: 0 };
        
        let touchPoints = { x1: player1.x, y1: player1.y, x2: player2.x, y2: player2.y };
        
        const scoreLeftSpan = document.getElementById('scoreLeft');
        const scoreRightSpan = document.getElementById('scoreRight');
        const leftLabel = document.getElementById('leftLabel');
        const rightLabel = document.getElementById('rightLabel');
        const menuOverlay = document.getElementById('menuOverlay');
        const backToMenuBtn = document.getElementById('backToMenuBtn');
        const twoPlayersBtn = document.getElementById('twoPlayersBtn');
        const botModeBtn = document.getElementById('botModeBtn');
        const controlsInfo = document.getElementById('controlsInfo');
        
        function updateScoreDisplay() {
            scoreLeftSpan.textContent = scores.left;
            scoreRightSpan.textContent = scores.right;
        }
        
        function resetPuck() {
            puck.x = W/2;
            puck.y = H/2;
            let angle = Math.random() * Math.PI * 2;
            let speed = 5;
            puck.vx = Math.cos(angle) * speed;
            puck.vy = Math.sin(angle) * speed;
            if (Math.abs(puck.vx) < 2) puck.vx = puck.vx > 0 ? 3 : -3;
            if (Math.abs(puck.vy) < 1.5) puck.vy = puck.vy > 0 ? 2 : -2;
        }
        
        function resetGame() {
            scores = { left: 0, right: 0 };
            updateScoreDisplay();
            player1.x = 120;
            player1.y = H/2;
            player2.x = W - 120;
            player2.y = H/2;
            resetPuck();
            gameActive = true;
        }
        
        function circlesCollide(x1, y1, r1, x2, y2, r2) {
            const dx = x1 - x2;
            const dy = y1 - y2;
            return Math.sqrt(dx * dx + dy * dy) < r1 + r2;
        }
        
        function handleCollision(paddle, puck) {
            if (circlesCollide(paddle.x, paddle.y, paddle.radius, puck.x, puck.y, puck.radius)) {
                const dx = puck.x - paddle.x;
                const dy = puck.y - paddle.y;
                const angle = Math.atan2(dy, dx);
                const speed = Math.hypot(puck.vx, puck.vy);
                const newSpeed = Math.min(12, speed + 1.5);
                puck.vx = Math.cos(angle) * newSpeed;
                puck.vy = Math.sin(angle) * newSpeed;
                if (paddle.vx) {
                    puck.vx += paddle.vx * 0.5;
                    puck.vy += paddle.vy * 0.5;
                }
                puck.x = paddle.x + Math.cos(angle) * (paddle.radius + puck.radius + 2);
                puck.y = paddle.y + Math.sin(angle) * (paddle.radius + puck.radius + 2);
                return true;
            }
            return false;
        }
        
        function checkGoal() {
            const leftGoalY = H/2 - GOAL_WIDTH/2;
            const rightGoalY = H/2 - GOAL_WIDTH/2;
            
            if (puck.x - puck.radius <= GOAL_HEIGHT &&
                puck.y + puck.radius > leftGoalY &&
                puck.y - puck.radius < leftGoalY + GOAL_WIDTH) {
                scores.right++;
                updateScoreDisplay();
                resetPuck();
                return true;
            }
            
            if (puck.x + puck.radius >= W - GOAL_HEIGHT &&
                puck.y + puck.radius > rightGoalY &&
                puck.y - puck.radius < rightGoalY + GOAL_WIDTH) {
                scores.left++;
                updateScoreDisplay();
                resetPuck();
                return true;
            }
            return false;
        }
        
        function updatePhysics() {
            if (!gameActive) return;
            
            puck.x += puck.vx;
            puck.y += puck.vy;
            
            if (puck.y - puck.radius <= 0) {
                puck.y = puck.radius;
                puck.vy = -puck.vy * 0.98;
            }
            if (puck.y + puck.radius >= H) {
                puck.y = H - puck.radius;
                puck.vy = -puck.vy * 0.98;
            }
            
            const leftGoalY = H/2 - GOAL_WIDTH/2;
            const rightGoalY = H/2 - GOAL_WIDTH/2;
            
            if (puck.x - puck.radius <= 0) {
                if (!(puck.y + puck.radius > leftGoalY && puck.y - puck.radius < leftGoalY + GOAL_WIDTH)) {
                    puck.x = puck.radius;
                    puck.vx = -puck.vx * 0.9;
                }
            }
            if (puck.x + puck.radius >= W) {
                if (!(puck.y + puck.radius > rightGoalY && puck.y - puck.radius < rightGoalY + GOAL_WIDTH)) {
                    puck.x = W - puck.radius;
                    puck.vx = -puck.vx * 0.9;
                }
            }
            
            handleCollision(player1, puck);
            handleCollision(player2, puck);
            checkGoal();
            
            const maxSpeed = 12;
            if (Math.abs(puck.vx) > maxSpeed) puck.vx = puck.vx > 0 ? maxSpeed : -maxSpeed;
            if (Math.abs(puck.vy) > maxSpeed) puck.vy = puck.vy > 0 ? maxSpeed : -maxSpeed;
            puck.vx *= 0.998;
            puck.vy *= 0.998;
        }
        
        function updateBot() {
            if (gameMode !== 'bot') return;
            
            let targetY = puck.y;
            if (puck.vx > 0 && puck.x > W/2) {
                targetY = puck.y + puck.vy * 12;
            }
            targetY = Math.max(PADDLE_RADIUS, Math.min(H - PADDLE_RADIUS, targetY));
            player2.y += (targetY - player2.y) * 0.1;
        }
        
        function updatePlayers() {
            if (gameMode === 'twoPlayers') {
                player1.x += (touchPoints.x1 - player1.x) * 0.3;
                player1.y += (touchPoints.y1 - player1.y) * 0.3;
                player2.x += (touchPoints.x2 - player2.x) * 0.3;
                player2.y += (touchPoints.y2 - player2.y) * 0.3;
            } else if (gameMode === 'bot') {
                player1.x += (touchPoints.x1 - player1.x) * 0.3;
                player1.y += (touchPoints.y1 - player1.y) * 0.3;
                updateBot();
            }
            
            player1.x = Math.max(60 + PADDLE_RADIUS, Math.min(W/2 - 50, player1.x));
            player1.y = Math.max(PADDLE_RADIUS, Math.min(H - PADDLE_RADIUS, player1.y));
            player2.x = Math.max(W/2 + 50, Math.min(W - 60 - PADDLE_RADIUS, player2.x));
            player2.y = Math.max(PADDLE_RADIUS, Math.min(H - PADDLE_RADIUS, player2.y));
            
            player1.vx = player1.x - (player1.prevX || player1.x);
            player1.vy = player1.y - (player1.prevY || player1.y);
            player2.vx = player2.x - (player2.prevX || player2.x);
            player2.vy = player2.y - (player2.prevY || player2.y);
            
            player1.prevX = player1.x;
            player1.prevY = player1.y;
            player2.prevX = player2.x;
            player2.prevY = player2.y;
        }
        
        function draw() {
            ctx.clearRect(0, 0, W, H);
            
            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, '#7cb8e0');
            grad.addColorStop(1, '#5a9ac0');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);
            
            ctx.beginPath();
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 4;
            ctx.setLineDash([15, 25]);
            ctx.moveTo(W/2, 0);
            ctx.lineTo(W/2, H);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.beginPath();
            ctx.arc(W/2, H/2, 80, 0, Math.PI * 2);
            ctx.stroke();
            
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(0, H/2 - GOAL_WIDTH/2, GOAL_HEIGHT, GOAL_WIDTH);
            ctx.fillRect(W - GOAL_HEIGHT, H/2 - GOAL_WIDTH/2, GOAL_HEIGHT, GOAL_WIDTH);
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(2, H/2 - GOAL_WIDTH/2 + 5, GOAL_HEIGHT - 4, GOAL_WIDTH - 10);
            ctx.fillStyle = '#2ecc71';
            ctx.fillRect(W - GOAL_HEIGHT + 2, H/2 - GOAL_WIDTH/2 + 5, GOAL_HEIGHT - 4, GOAL_WIDTH - 10);
            
            ctx.shadowBlur = 10;
            const grad1 = ctx.createRadialGradient(player1.x-10, player1.y-10, 5, player1.x, player1.y, PADDLE_RADIUS);
            grad1.addColorStop(0, '#ff6b6b');
            grad1.addColorStop(1, '#c0392b');
            ctx.fillStyle = grad1;
            ctx.beginPath();
            ctx.arc(player1.x, player1.y, PADDLE_RADIUS, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.font = `${PADDLE_RADIUS * 0.65}px "Segoe UI Emoji"`;
            ctx.fillStyle = 'white';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(player1.avatar, player1.x, player1.y);
            
            const grad2 = ctx.createRadialGradient(player2.x-10, player2.y-10, 5, player2.x, player2.y, PADDLE_RADIUS);
            grad2.addColorStop(0, '#4ecdc4');
            grad2.addColorStop(1, '#2c7a6e');
            ctx.fillStyle = grad2;
            ctx.beginPath();
            ctx.arc(player2.x, player2.y, PADDLE_RADIUS, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'white';
            ctx.fillText(player2.avatar, player2.x, player2.y);
            
            ctx.fillStyle = '#2c3e50';
            ctx.beginPath();
            ctx.arc(puck.x, puck.y, PUCK_RADIUS, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ecf0f1';
            ctx.beginPath();
            ctx.arc(puck.x-3, puck.y-3, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            ctx.font = 'bold 14px "Segoe UI"';
            ctx.fillStyle = 'white';
            ctx.textAlign = 'left';
            if (gameMode === 'twoPlayers') ctx.fillText('👥 2 игрока', 20, 35);
            else if (gameMode === 'bot') ctx.fillText('🤖 Игрок VS Бот', 20, 35);
        }
        
        function handleTouch(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const scaleX = W / rect.width;
            const scaleY = H / rect.height;
            
            for(let i = 0; i < e.touches.length; i++) {
                const touch = e.touches[i];
                let canvasX = (touch.clientX - rect.left) * scaleX;
                let canvasY = (touch.clientY - rect.top) * scaleY;
                canvasX = Math.max(0, Math.min(W, canvasX));
                canvasY = Math.max(0, Math.min(H, canvasY));
                
                if (gameMode === 'twoPlayers') {
                    if (canvasX < W/2) {
                        touchPoints.x1 = canvasX;
                        touchPoints.y1 = canvasY;
                    } else {
                        touchPoints.x2 = canvasX;
                        touchPoints.y2 = canvasY;
                    }
                } else if (gameMode === 'bot') {
                    touchPoints.x1 = canvasX;
                    touchPoints.y1 = canvasY;
                }
            }
        }
        
        function startTwoPlayers() {
            gameMode = 'twoPlayers';
            leftLabel.innerHTML = '🔴 ИГРОК 1';
            rightLabel.innerHTML = '🔵 ИГРОК 2';
            resetGame();
            menuOverlay.style.display = 'none';
            controlsInfo.innerHTML = '👥 Левая половина экрана - красный игрок | Правая половина - синий игрок';
        }
        
        function startBotMode() {
            gameMode = 'bot';
            leftLabel.innerHTML = '🔴 ИГРОК';
            rightLabel.innerHTML = '🤖 БОТ';
            resetGame();
            menuOverlay.style.display = 'none';
            controlsInfo.innerHTML = '🤖 Игра против компьютера - водите пальцем по экрану';
        }
        
        function backToMenu() {
            gameMode = null;
            menuOverlay.style.display = 'flex';
            resetGame();
            controlsInfo.innerHTML = '🎮 Выберите режим в меню';
        }
        
        function gameLoop() {
            if (gameMode) {
                updatePlayers();
                updatePhysics();
                draw();
            }
            requestAnimationFrame(gameLoop);
        }
        
        canvas.addEventListener('touchstart', handleTouch);
        canvas.addEventListener('touchmove', handleTouch);
        canvas.addEventListener('touchend', (e) => e.preventDefault());
        
        twoPlayersBtn.onclick = startTwoPlayers;
        botModeBtn.onclick = startBotMode;
        backToMenuBtn.onclick = backToMenu;
        
        gameLoop();
    </script>
</body>
</html>
