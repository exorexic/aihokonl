<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>P2P Аэрохоккей</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #222; color: white; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; align-items: center; }
        canvas { background: #e0f7fa; border: 2px solid #00acc1; max-width: 100%; display: none; touch-action: none; }
        #menu { padding: 20px; text-align: center; }
        .btn { padding: 10px 20px; margin: 10px; background: #00acc1; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
        .char-select { margin: 20px 0; }
        #online-ui { display: none; margin-top: 20px; border-top: 1px solid #555; padding-top: 20px; }
        input { padding: 10px; margin-bottom: 10px; border-radius: 5px; border: none; }
    </style>
</head>
<body>

<div id="menu">
    <h1>Аэрохоккей</h1>
    
    <div class="char-select">
        <h3>Выбери класс:</h3>
        <label><input type="radio" name="char" value="light"> Ловкач (быстрый, маленький)</label><br>
        <label><input type="radio" name="char" value="normal" checked> Сбалансированный</label><br>
        <label><input type="radio" name="char" value="tank"> Танк (медленный, огромный)</label>
    </div>

    <button class="btn" onclick="startGame('bot')">Играть с Ботом</button>
    <button class="btn" onclick="showOnlineUI()">Играть Онлайн (P2P)</button>

    <div id="online-ui">
        <p>Ваш ID: <span id="my-id">Загрузка...</span></p>
        <input type="text" id="peer-id-input" placeholder="Введите ID друга">
        <br>
        <button class="btn" onclick="connectToPeer()">Подключиться к другу</button>
    </div>
</div>

<canvas id="gameCanvas" width="400" height="600"></canvas>

<script>
    // --- НАСТРОЙКИ КЛАССОВ ---
    const classes = {
        light: { radius: 20, maxSpeed: 8, color: '#ff5252' },
        normal: { radius: 30, maxSpeed: 6, color: '#448aff' },
        tank: { radius: 45, maxSpeed: 4, color: '#4caf50' }
    };

    // --- ИГРОВЫЕ ПЕРЕМЕННЫЕ ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let gameLoop;
    let mode = ''; // 'bot' или 'p2p'
    let isHost = true; // Для P2P: хост считает физику

    // Игровые объекты
    let p1 = { x: 200, y: 500, radius: 30, color: 'blue', vx: 0, vy: 0, score: 0 };
    let p2 = { x: 200, y: 100, radius: 30, color: 'red', vx: 0, vy: 0, score: 0 };
    let puck = { x: 200, y: 300, radius: 15, vx: 0, vy: 0, speedLimit: 15 };

    // --- УПРАВЛЕНИЕ P2P (PeerJS) ---
    let peer, conn;
    
    function initPeer() {
        peer = new Peer(); // Создаем подключение к бесплатному сигнальному серверу PeerJS
        peer.on('open', id => document.getElementById('my-id').innerText = id);
        
        // Если кто-то подключается к нам
        peer.on('connection', connection => {
            conn = connection;
            isHost = true; // Хост считает физику шайбы
            setupConnection();
            startGame('p2p');
        });
    }
    
    function showOnlineUI() {
        document.getElementById('online-ui').style.display = 'block';
        if (!peer) initPeer();
    }

    function connectToPeer() {
        const id = document.getElementById('peer-id-input').value;
        if (!id) return;
        conn = peer.connect(id);
        isHost = false; // Клиент просто шлет свои координаты и получает данные шайбы
        setupConnection();
        startGame('p2p');
    }

    function setupConnection() {
        conn.on('data', data => {
            if (isHost) {
                // Хост получает позицию клиента (P2)
                p2.x = 400 - data.x; // Зеркалим координаты для соперника
                p2.y = 600 - data.y;
            } else {
                // Клиент получает позицию хоста (P2), шайбы и счет
                p2.x = 400 - data.p1.x;
                p2.y = 600 - data.p1.y;
                puck.x = 400 - data.puck.x;
                puck.y = 600 - data.puck.y;
                p1.score = data.score2;
                p2.score = data.score1;
            }
        });
    }

    // --- ЛОГИКА ИГРЫ ---
    function startGame(selectedMode) {
        mode = selectedMode;
        const charChoice = document.querySelector('input[name="char"]:checked').value;
        
        // Применяем характеристики
        p1.radius = classes[charChoice].radius;
        p1.color = classes[charChoice].color;
        // Для бота задаем стандартные характеристики
        p2.radius = classes['normal'].radius; 

        document.getElementById('menu').style.display = 'none';
        canvas.style.display = 'block';

        // Управление (Мышь / Тач)
        canvas.addEventListener('touchmove', handleMove);
        canvas.addEventListener('mousemove', handleMove);

        resetPuck();
        update();
    }

    function handleMove(e) {
        e.preventDefault();
        let rect = canvas.getBoundingClientRect();
        let clientX = e.touches ? e.touches[0].clientX : e.clientX;
        let clientY = e.touches ? e.touches[0].clientY : e.clientY;
        
        let scaleX = canvas.width / rect.width;
        let scaleY = canvas.height / rect.height;

        let newX = (clientX - rect.left) * scaleX;
        let newY = (clientY - rect.top) * scaleY;

        // Ограничиваем движение своей половиной поля (низ)
        p1.x = Math.max(p1.radius, Math.min(canvas.width - p1.radius, newX));
        p1.y = Math.max(canvas.height / 2 + p1.radius, Math.min(canvas.height - p1.radius, newY));
    }

    function resetPuck() {
        puck.x = canvas.width / 2;
        puck.y = canvas.height / 2;
        puck.vx = 0;
        puck.vy = 0;
    }

    function resolveCollision(player, pck) {
        let dx = pck.x - player.x;
        let dy = pck.y - player.y;
        let distance = Math.sqrt(dx * dx + dy * dy);

        if (distance < player.radius + pck.radius) {
            let angle = Math.atan2(dy, dx);
            // Сила удара (базовая + отскок)
            let force = 7; 
            pck.vx = Math.cos(angle) * force;
            pck.vy = Math.sin(angle) * force;
            
            // Выталкиваем шайбу из игрока, чтобы не застревала
            pck.x = player.x + Math.cos(angle) * (player.radius + pck.radius);
            pck.y = player.y + Math.sin(angle) * (player.radius + pck.radius);
        }
    }

    function update() {
        if (isHost || mode === 'bot') {
            // Физика шайбы (считает только хост или одиночная игра)
            puck.x += puck.vx;
            puck.y += puck.vy;
            puck.vx *= 0.99; // Трение
            puck.vy *= 0.99;

            // Отскок шайбы от стен
            if (puck.x - puck.radius < 0 || puck.x + puck.radius > canvas.width) {
                puck.vx *= -1;
                puck.x = puck.x - puck.radius < 0 ? puck.radius : canvas.width - puck.radius;
            }
            if (puck.y - puck.radius < 0 || puck.y + puck.radius > canvas.height) {
                // Гол? Ворота (по центру)
                if (puck.x > 120 && puck.x < 280) {
                    if (puck.y < 0) { p1.score++; resetPuck(); }
                    else if (puck.y > canvas.height) { p2.score++; resetPuck(); }
                } else {
                    puck.vy *= -1;
                    puck.y = puck.y - puck.radius < 0 ? puck.radius : canvas.height - puck.radius;
                }
            }

            // Столкновения
            resolveCollision(p1, puck);
            resolveCollision(p2, puck);

            // Логика бота
            if (mode === 'bot') {
                let targetX = puck.y < canvas.height / 2 ? puck.x : canvas.width / 2;
                p2.x += (targetX - p2.x) * 0.1; // Скорость реакции
                // Ограничение бота в верхней половине
                p2.y = 100; // Держится на одной линии (для простоты)
            }
        }

        // Обмен данными P2P
        if (mode === 'p2p' && conn && conn.open) {
            if (isHost) {
                conn.send({ p1: p1, puck: puck, score1: p1.score, score2: p2.score });
            } else {
                conn.send({ x: p1.x, y: p1.y }); // Клиент шлет только свою позицию
            }
        }

        draw();
        gameLoop = requestAnimationFrame(update);
    }

    function draw() {
        // Очистка и фон
        ctx.fillStyle = '#e0f7fa';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Центральная линия
        ctx.beginPath();
        ctx.moveTo(0, canvas.height / 2);
        ctx.lineTo(canvas.width, canvas.height / 2);
        ctx.strokeStyle = '#00acc1';
        ctx.stroke();

        // Ворота
        ctx.fillStyle = '#ff5252';
        ctx.fillRect(120, 0, 160, 10); // Верхние
        ctx.fillStyle = '#448aff';
        ctx.fillRect(120, canvas.height - 10, 160, 10); // Нижние

        // Очки
        ctx.fillStyle = '#555';
        ctx.font = '40px Arial';
        ctx.fillText(p2.score, 20, canvas.height / 2 - 20);
        ctx.fillText(p1.score, 20, canvas.height / 2 + 50);

        // Игрок 1
        ctx.beginPath();
        ctx.arc(p1.x, p1.y, p1.radius, 0, Math.PI * 2);
        ctx.fillStyle = p1.color;
        ctx.fill();

        // Игрок 2 (или Бот)
        ctx.beginPath();
        ctx.arc(p2.x, p2.y, p2.radius, 0, Math.PI * 2);
        ctx.fillStyle = p2.color;
        ctx.fill();

        // Шайба
        ctx.beginPath();
        ctx.arc(puck.x, puck.y, puck.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#222';
        ctx.fill();
    }
</script>
</body>
</html>
