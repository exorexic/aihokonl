<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PUCK MASTER - Pro Edition</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        body { margin: 0; padding: 0; background: #050510; color: #fff; font-family: 'Orbitron', sans-serif; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        
        #menu { background: rgba(10, 10, 25, 0.95); padding: 30px; border-radius: 20px; border: 2px solid #00f2ff; box-shadow: 0 0 30px rgba(0, 242, 255, 0.3); text-align: center; width: 320px; z-index: 10; }
        h1 { color: #00f2ff; text-transform: uppercase; letter-spacing: 4px; text-shadow: 0 0 15px #00f2ff; margin-bottom: 20px; font-size: 24px; }
        
        #status-bar { font-size: 10px; color: #00f2ff; margin-bottom: 15px; padding: 5px; background: rgba(0,0,0,0.3); border-radius: 5px; }
        
        .char-select { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        .char-label { display: flex; align-items: center; justify-content: space-between; padding: 10px 15px; background: #11112b; border: 1px solid #222; border-radius: 10px; cursor: pointer; font-size: 13px; transition: 0.2s; }
        .char-label input { display: none; }
        .char-label:hover { border-color: #00f2ff; }
        .char-label:has(input:checked) { border-color: #00f2ff; background: #16163d; box-shadow: 0 0 10px rgba(0, 242, 255, 0.3); }

        .btn { width: 100%; padding: 14px; margin: 5px 0; background: linear-gradient(135deg, #00f2ff, #0066ff); color: white; border: none; border-radius: 10px; font-family: 'Orbitron'; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 12px; }
        .btn-bot { background: linear-gradient(135deg, #ff0055, #990033); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        #online-ui { display: none; margin-top: 15px; border-top: 1px solid #333; padding-top: 15px; }
        input[type="text"] { width: 100%; padding: 10px; box-sizing: border-box; margin-bottom: 10px; border-radius: 8px; border: 1px solid #333; background: #000; color: #00f2ff; text-align: center; font-family: 'Orbitron'; font-size: 12px; }

        canvas { background: #000; border: 4px solid #111; border-radius: 15px; display: none; touch-action: none; }
        #ui-layer { position: absolute; top: 20px; width: 100%; text-align: center; pointer-events: none; display: none; }
    </style>
</head>
<body>

<div id="menu">
    <h1>PUCK MASTER</h1>
    <div id="status-bar">Система готова</div>
    
    <div class="char-select">
        <label class="char-label"><input type="radio" name="char" value="light"> <span>ЛОВКАЧ</span> <b style="color:#ff0055">●</b></label>
        <label class="char-label"><input type="radio" name="char" value="normal" checked> <span>АТЛЕТ</span> <b style="color:#00f2ff">●</b></label>
        <label class="char-label"><input type="radio" name="char" value="tank"> <span>ТАНК</span> <b style="color:#00ff88">●</b></label>
    </div>

    <button class="btn btn-bot" onclick="startGame('bot')">Против БОТА</button>
    <button class="btn" id="online-btn" onclick="showOnlineUI()">P2P ОНЛАЙН</button>

    <div id="online-ui">
        <div style="font-size: 9px; margin-bottom: 5px;">ВАШ ID (отправьте другу):</div>
        <div id="my-id" style="color:#ff0055; font-size: 12px; margin-bottom: 10px; font-weight: bold; cursor: pointer;" onclick="copyID()">ОЖИДАНИЕ...</div>
        <input type="text" id="peer-id-input" placeholder="ID ДРУГА">
        <button class="btn" onclick="connectToPeer()">СОЕДИНИТЬСЯ</button>
    </div>
</div>

<div id="ui-layer">
    <div id="game-info" style="color: rgba(255,255,255,0.5); font-size: 12px;"></div>
</div>

<canvas id="gameCanvas" width="400" height="600"></canvas>

<script>
    // --- ЗВУК ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    function initAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }
    function playSfx(f, t, d, v=0.1) {
        if (!audioCtx) return;
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = t; o.frequency.setValueAtTime(f, audioCtx.currentTime);
        g.gain.setValueAtTime(v, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + d);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + d);
    }

    // --- НАСТРОЙКИ ---
    const classes = {
        light: { radius: 22, color: '#ff0055' },
        normal: { radius: 32, color: '#00f2ff' },
        tank: { radius: 48, color: '#00ff88' }
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status-bar');
    let mode = '', isHost = true, peer, conn, gameActive = false;

    let p1 = { x: 200, y: 500, radius: 32, color: '#00f2ff', score: 0 };
    let p2 = { x: 200, y: 100, radius: 32, color: '#ff0055', score: 0 };
    let puck = { x: 200, y: 300, radius: 15, vx: 0, vy: 0 };

    // --- КОПИРОВАНИЕ ID ---
    function copyID() {
        const idText = document.getElementById('my-id').innerText;
        navigator.clipboard.writeText(idText);
        status.innerText = "ID скопирован!";
    }

    // --- СЕТЕВАЯ ЛОГИКА ---
    function showOnlineUI() {
        document.getElementById('online-ui').style.display = 'block';
        if (peer) return;

        status.innerText = "Инициализация сети...";
        peer = new Peer();

        peer.on('open', id => {
            document.getElementById('my-id').innerText = id;
            status.innerText = "Сеть готова. Ждем подключения.";
        });

        peer.on('connection', c => {
            if (conn) { c.close(); return; } // Только 1 игрок
            conn = c;
            isHost = true;
            setupConnection();
            status.innerText = "Игрок подключился! Начинаем...";
            setTimeout(() => startGame('p2p'), 1000);
        });

        peer.on('error', err => {
            status.innerText = "Ошибка: " + err.type;
            console.error(err);
        });
    }

    function connectToPeer() {
        const targetId = document.getElementById('peer-id-input').value.trim();
        if (!targetId) return;
        
        status.innerText = "Подключение к " + targetId + "...";
        conn = peer.connect(targetId);
        isHost = false;
        setupConnection();

        conn.on('open', () => {
            status.innerText = "Успешно! Запуск...";
            startGame('p2p');
        });
    }

    function setupConnection() {
        conn.on('data', data => {
            if (isHost) {
                p2.x = 400 - data.x; p2.y = 600 - data.y;
                p2.radius = data.radius; p2.color = data.color;
            } else {
                // Принимаем всё состояние от хоста
                p2.x = 400 - data.p1.x; p2.y = 600 - data.p1.y;
                p2.radius = data.p1.radius; p2.color = data.p1.color;
                puck.x = 400 - data.puck.x; puck.y = 600 - data.puck.y;
                p1.score = data.score2; p2.score = data.score1;
                puck.radius = data.puck.radius || 15;
            }
        });
        conn.on('close', () => {
            alert("Игрок отключился.");
            location.reload();
        });
    }

    // --- ИГРА ---
    function startGame(m) {
        initAudio();
        mode = m;
        const choice = document.querySelector('input[name="char"]:checked').value;
        p1.radius = classes[choice].radius;
        p1.color = classes[choice].color;

        document.getElementById('menu').style.display = 'none';
        document.getElementById('ui-layer').style.display = 'block';
        canvas.style.display = 'block';
        gameActive = true;

        canvas.addEventListener('touchmove', e => handleInput(e.touches[0].clientX, e.touches[0].clientY));
        canvas.addEventListener('mousemove', e => handleInput(e.clientX, e.clientY));

        update();
    }

    function handleInput(cx, cy) {
        let rect = canvas.getBoundingClientRect();
        p1.x = Math.max(p1.radius, Math.min(400 - p1.radius, (cx - rect.left) * (400 / rect.width)));
        p1.y = Math.max(300 + p1.radius, Math.min(600 - p1.radius, (cy - rect.top) * (600 / rect.height)));
    }

    function resetPuck() {
        puck = { x: 200, y: 300, vx: 0, vy: 0, radius: 15 };
    }

    function resolveColl(p, pk) {
        let dx = pk.x - p.x, dy = pk.y - p.y;
        let dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < p.radius + pk.radius) {
            playSfx(440, 'triangle', 0.1);
            let angle = Math.atan2(dy, dx);
            let force = 12;
            pk.vx = Math.cos(angle) * force;
            pk.vy = Math.sin(angle) * force;
            pk.x = p.x + Math.cos(angle) * (p.radius + pk.radius + 2);
            pk.y = p.y + Math.sin(angle) * (p.radius + pk.radius + 2);
        }
    }

    function update() {
        if (!gameActive) return;

        if (isHost || mode === 'bot') {
            puck.x += puck.vx; puck.y += puck.vy;
            puck.vx *= 0.985; puck.vy *= 0.985;

            if (puck.x < puck.radius || puck.x > 400 - puck.radius) {
                puck.vx *= -1; playSfx(150, 'square', 0.05);
                puck.x = puck.x < puck.radius ? puck.radius : 400 - puck.radius;
            }

            if (puck.y < -puck.radius || puck.y > 600 + puck.radius) {
                if (puck.x > 125 && puck.x < 275) {
                    playSfx(200, 'sawtooth', 0.4);
                    if (puck.y < 300) p1.score++; else p2.score++;
                    resetPuck();
                } else {
                    puck.vy *= -1; playSfx(150, 'square', 0.05);
                    puck.y = puck.y < puck.radius ? puck.radius : 600 - puck.radius;
                }
            }

            resolveColl(p1, puck);
            resolveColl(p2, puck);

            if (mode === 'bot') {
                let r = 0.18;
                if (puck.y < 300) {
                    p2.x += (puck.x - p2.x) * r;
                    p2.y += (puck.y - p2.y) * r;
                } else {
                    p2.x += (200 - p2.x) * 0.05; p2.y += (100 - p2.y) * 0.05;
                }
                p2.x = Math.min(400-p2.radius, Math.max(p2.radius, p2.x));
                p2.y = Math.min(300-p2.radius, Math.max(p2.radius, p2.y));
            }
        }

        // Сетевой обмен
        if (mode === 'p2p' && conn && conn.open) {
            if (isHost) {
                conn.send({ p1, puck, score1: p1.score, score2: p2.score });
            } else {
                conn.send({ x: p1.x, y: p1.y, radius: p1.radius, color: p1.color });
            }
        }

        draw();
        requestAnimationFrame(update);
    }

    function draw() {
        ctx.fillStyle = '#050510'; ctx.fillRect(0, 0, 400, 600);
        
        ctx.strokeStyle = '#111133'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(0,300); ctx.lineTo(400,300); ctx.stroke();
        ctx.beginPath(); ctx.arc(200,300,60,0,Math.PI*2); ctx.stroke();

        // Ворота
        ctx.shadowBlur = 15;
        ctx.fillStyle = '#ff0055'; ctx.shadowColor = '#ff0055'; ctx.fillRect(125, 0, 150, 8);
        ctx.fillStyle = '#00f2ff'; ctx.shadowColor = '#00f2ff'; ctx.fillRect(125, 592, 150, 8);

        // Счет
        ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.font = '80px Orbitron';
        ctx.fillText(p2.score, 200, 250); ctx.fillText(p1.score, 200, 420);

        drawObj(p1); drawObj(p2);
        
        ctx.shadowBlur = 15; ctx.shadowColor = '#fff'; ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(puck.x, puck.y, puck.radius, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;
    }

    function drawObj(p) {
        ctx.shadowBlur = 20; ctx.shadowColor = p.color;
        let g = ctx.createRadialGradient(p.x - p.radius/3, p.y - p.radius/3, 2, p.x, p.y, p.radius);
        g.addColorStop(0, '#fff'); g.addColorStop(0.3, p.color); g.addColorStop(1, '#000');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;
    }
</script>
</body>
</html>
